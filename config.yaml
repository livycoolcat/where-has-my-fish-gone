# All paths are relative to the repo folder.
# The DFO data goes in data/raw/55158 (ignored by git) - see README "Setup".

# DFO data (not in the repo)
raw_data:     data/raw/55158/DATA                       # .01A files, one folder per month
weeks:        data/raw/55158/Weeks                      # .01A files sorted into week1 ... week54
regions_evr:  data/raw/55158/Echoview/Exports/Regions   # DFO's WeekN.EVR region files
dfo_cell_exports: data/raw/55158/Sv_exports             # dfo's WeekN_KrillSv.csv cell exports (daytime, surface and near transducer lines)

# In the repo
evr_windows:  data/region_labels/evr_windows.csv        # start/end of each WeekN.EVR
region_labels: data/region_labels                       # region counts per species
calibration:  data/calibration/azfp_calibration.csv     # EL, DS, TVR, VTX, BP, sound speed, absorption
processed:    data/processed                            # region CSVs per split

# Train/val/test splits: folder name -> share of weeks for validation AND for test (each)
#   0.15 -> 70% train / 15% val / 15% test
#   0.20 -> 60% train / 20% val / 20% test
splits:
  split_7030: 0.15
  split_8020: 0.20
  # same shares, but whole days are kept together (not weeks) and each species is balanced per season
  split_day_7030: {frac: 0.15, group: day, balance_season: true}
  split_day_8020: {frac: 0.20, group: day, balance_season: true}

# Which split the later steps use (change here, or use --split on the command line)
split: split_7030

# Data cleaning (pipeline.py clean)
bad_data:     data/processed/bad_data                   # bad_data_list.csv, mask_summary.csv
# End of deployment: the signal is lost on 1 Mar 2026 (~17:03, surface echo fades out); everything
# from here on is bad data. DFO's own bad region in Week53.EVR starts at this time.
bad_data_after: "2026-03-01 16:59:29"
# dfo's surface line comes from 10 min intervals that only cover their daytime window; a ping further
# than this from any interval has no surface line (mask code 16 in daytime)
dfo_line_max_gap_min: 60

# Daytime (pipeline.py solar)
daytime:      data/processed/daytime                    # sun_times.csv
latitude:     49.5348                                   # mooring position
longitude:    -124.0110
# the instrument clock has no time zone; it is utc plus this many hours (checked by pipeline.py solar)
# confirmed utc minus 8 all year with no daylight saving: dfo's daytime window is 1 h after sunrise to
# 1 h before sunset in local time, and it shifts by 1 h in this clock exactly on 9 mar and 2 nov 2025
clock_utc_offset: -8
# daytime means the sun is more than this many degrees above the horizon
daytime_min_elevation: 0

# Outputs (ignored by git)
sv_output:    data/processed/Sv                         # week1_Sv.zarr, week1_mask.zarr, ...
sv_plots:     data/processed/Sv/plots
